<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="P&amp;P Control">
<meta name="theme-color" content="#1F3A5F">
<title>Pour &amp; Pixel Control Centre</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 420'%3E%3Crect x='20' y='20' width='380' height='380' rx='60' fill='%231F3A5F'/%3E%3Cpath d='M210 70C178 118 122 172 122 236a88 88 0 0 0 176 0c0-64-56-118-88-166z' fill='%23F4EBDD'/%3E%3Crect x='178' y='214' width='64' height='64' rx='8' fill='%232A9D8F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column on a phone, two on a laptop; tabs fixed at the bottom like an app. */
:root{
  --bg:#F7F3EC; --card:#FFFFFF; --ink:#14263D; --muted:#5B6878; --line:#E6DDCF; --soft:#F1EADF;
  --navy:#1F3A5F; --teal:#1E7A6F; --teal-2:#2A9D8F; --tint:#DCEFEC;
  --good:#1E7A6F; --warn:#9A6212; --warn-bg:#FBF0DC; --bad:#A8412C; --bad-bg:#FBE9E4;
  --s1:#8DA2BC; --s2:#6683A6; --s3:#46658C; --s4:#2C4E78; --s5:#2A7F94; --s6:#2A9D8F; --s7:#23907F; --s8:#14765F;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1825; --card:#152335; --ink:#E9EFF6; --muted:#9BAABB; --line:#26384D; --soft:#1B2C41;
  --navy:#9DC2EA; --teal:#52C3B3; --teal-2:#52C3B3; --tint:#17383A;
  --good:#52C3B3; --warn:#E8B45C; --warn-bg:#33281A; --bad:#F08A72; --bad-bg:#3A2220;
  --s1:#53698A; --s2:#5E7DA6; --s3:#6A92C2; --s4:#79A6DA; --s5:#3FA3B6; --s6:#46B8A9; --s7:#4FC7A2; --s8:#63D69A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1825; --card:#152335; --ink:#E9EFF6; --muted:#9BAABB; --line:#26384D; --soft:#1B2C41;
  --navy:#9DC2EA; --teal:#52C3B3; --teal-2:#52C3B3; --tint:#17383A;
  --good:#52C3B3; --warn:#E8B45C; --warn-bg:#33281A; --bad:#F08A72; --bad-bg:#3A2220;
  --s1:#53698A; --s2:#5E7DA6; --s3:#6A92C2; --s4:#79A6DA; --s5:#3FA3B6; --s6:#46B8A9; --s7:#4FC7A2; --s8:#63D69A;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding:0 max(16px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
a{color:var(--teal)}
h1,h2{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:19px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left)));
  padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px}
.top h1{font-size:18px}
.top small{display:block;color:var(--muted);font-size:12px}
.top .grow{flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.iconbtn:focus-visible,.tab:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.testbar{background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:13px;border-radius:10px;padding:8px 12px;margin-top:12px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  display:flex;justify-content:center;gap:4px}
.tab{flex:1;max-width:160px;border:0;background:none;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--navy);background:var(--soft)}
.tab .dot{position:absolute;top:2px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px}

main{padding-top:16px}
.grid{display:grid;gap:16px}
@media (min-width:860px){.grid.two{grid-template-columns:1.15fr .85fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card > h2{margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.card > h2 .count{font:600 13px var(--body);color:var(--muted)}
.lead{color:var(--muted);font-size:13px;margin:-6px 0 12px}

/* needs you */
.todo{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--soft);cursor:pointer;border:0;text-align:left;width:100%}
.item .badge{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;margin-top:2px}
.item b{display:block}
.item span.sub{display:block;color:var(--muted);font-size:13px}
.item .main{min-width:0;flex:1}
.b-paid{background:var(--tint);color:var(--good)}
.b-act{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--card);color:var(--navy);border:1px solid var(--line)}
.calm{color:var(--muted);padding:6px 2px}

/* money */
.money{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.money{grid-template-columns:repeat(4,1fr)}}
.stat .v{font:600 26px/1.1 var(--display);color:var(--navy)}
.stat .k{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--teal-2)}

/* pipeline */
.pipe{display:flex;flex-direction:column;gap:4px}
.prow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.prow:hover{background:var(--soft)}
.prow .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.prow .lab{min-width:0}
.prow .lab b{font-weight:600}
.prow .bar{height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.prow .bar i{display:block;height:100%;border-radius:3px}
.prow .c{font:600 20px var(--display);min-width:2ch;text-align:right}
.outs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.conv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.conv div{background:var(--soft);border-radius:10px;padding:8px 10px}
.conv b{display:block;font:600 18px var(--display);color:var(--navy)}
.conv span{font-size:12px;color:var(--muted)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.chip .k{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}

/* today */
.limits{display:flex;flex-direction:column;gap:10px}
.lim .t{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.lim .t span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{font:11px var(--body);fill:var(--muted)}
.chart .val{fill:var(--ink);font-weight:600}
.prog{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}
.prog span{color:var(--muted)}

/* list */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:16px}
.search:focus{outline:2px solid var(--teal);outline-offset:1px}
.list{display:flex;flex-direction:column;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;color:#fff}
.pill.out{background:var(--soft);color:var(--muted)}
.pill.rep{background:var(--warn-bg);color:var(--warn)}
.detail{padding:4px 14px 16px;border-top:1px dashed var(--line);background:var(--soft)}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0;font-size:14px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:0}
.tl li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.tl li i{width:10px;height:10px;border-radius:50%;background:var(--line);justify-self:center}
.tl li.on i{background:var(--teal-2)}
.tl li.off{color:var(--muted)}
.tl li span.dt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.quote{background:var(--card);border-left:3px solid var(--warn);border-radius:6px;padding:8px 10px;font-size:14px;margin:8px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;min-height:40px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--card)}
.more{display:block;margin:12px auto 0;}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* activity */
.day{margin-top:14px}
.day h3{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.ev{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ev:first-of-type{border-top:0}
.ev i{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--s3)}
.ev i.g{background:var(--good)} .ev i.w{background:var(--warn)} .ev i.r{background:var(--bad)}
.ev span{color:var(--muted)}

/* pitch switch */
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ptag{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.ptag.w{background:var(--tint);color:var(--teal)}
.ptag.h{background:var(--warn-bg);color:var(--warn)}
.wl{display:flex;flex-direction:column;gap:6px}
.wl .r{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14px}
.wl .r b{font-weight:600}.wl .r .n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.6em}
.wl .r .sub{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
.hint{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line);font-size:13px;color:var(--muted)}
.hint code{font:600 13px var(--body);color:var(--ink)}

/* lock screen */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.lock form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
.lock svg{margin:0 auto 10px;display:block}
.lock h1{font-size:24px;margin-bottom:6px}
.lock p{color:var(--muted);margin:0 0 18px;font-size:14px}
.lock input[type=password]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:13px 14px;font-size:16px;margin-bottom:10px}
.lock label.rem{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--muted);margin:4px 0 16px}
.lock button{width:100%;border:0;background:var(--teal);color:#fff;font-weight:700;border-radius:12px;padding:13px;font-size:16px;cursor:pointer}
.lock .err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px;margin:0 0 6px}
@media (prefers-reduced-motion:no-preference){.card,.row{transition:background .15s}}
</style>
</head>
<body>
<div id="lock" class="lock">
 <form id="lockform" autocomplete="on">
  <svg viewBox="0 0 420 420" width="56" height="56" aria-hidden="true"><rect x="20" y="20" width="380" height="380" rx="60" fill="#2C4E78"/><path d="M210 70C178 118 122 172 122 236a88 88 0 0 0 176 0c0-64-56-118-88-166z" fill="#F4EBDD"/><rect x="178" y="214" width="64" height="64" rx="8" fill="#2A9D8F"/><rect x="314" y="300" width="24" height="24" rx="6" fill="#2A9D8F"/><rect x="346" y="332" width="24" height="24" rx="6" fill="#CFE6E2"/></svg>
  <h1>Control centre</h1>
  <p>Pour &amp; Pixel. Enter your password to see what's going on.</p>
  <input type="hidden" name="username" value="pour-and-pixel" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
  <p class="err" id="lockerr" role="alert"></p>
  <label class="rem"><input type="checkbox" id="remember" checked> Keep me signed in on this phone</label>
  <button type="submit" id="unlockbtn">Open</button>
 </form>
</div>

<div id="app" hidden>
 <header class="top"><div class="wrap">
  <svg viewBox="0 0 420 420" width="34" height="34" aria-hidden="true"><rect x="20" y="20" width="380" height="380" rx="60" fill="#2C4E78"/><path d="M210 70C178 118 122 172 122 236a88 88 0 0 0 176 0c0-64-56-118-88-166z" fill="#F4EBDD"/><rect x="178" y="214" width="64" height="64" rx="8" fill="#2A9D8F"/></svg>
  <div class="grow"><h1>Control centre</h1><small id="updated"></small></div>
  <button class="iconbtn" id="refresh" aria-label="Refresh" title="Refresh"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button class="iconbtn" id="lockbtn" aria-label="Lock" title="Lock"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
 </div></header>
 <div class="wrap">
  <div class="testbar" id="testbar" hidden>Test mode is on. Nothing is going to businesses yet.</div>
  <div class="seg" id="seg" role="group" aria-label="Which pitch">
   <button data-p="all">All</button><button data-p="w">Website</button><button data-p="h">Hospitality</button></div>
  <main>
   <section id="v-overview" class="grid two"></section>
   <section id="v-list" hidden></section>
   <section id="v-calls" hidden></section>
   <section id="v-activity" hidden></section>
  </main>
 </div>
 <nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-v="overview" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview<span class="dot" id="todo-dot" hidden></span></button>
  <button class="tab" role="tab" data-v="list" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Businesses</button>
  <button class="tab" role="tab" data-v="calls" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>Call list</button>
  <button class="tab" role="tab" data-v="activity" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>

<script>
"use strict";
const STAGES = [
  ["first","First email"],["fu1","Follow-up 1"],["fu2","Follow-up 2"],["q","Questionnaire filled"],
  ["draft","Draft + payment link sent"],["dfu1","Draft follow-up 1"],["dfu2","Draft follow-up 2"],["paid","Paid"]];
const OUTCOMES = [["replied","Replied"],["draft_replied","Replied to draft"],["noreply","No response"],
  ["draft_noreply","No response to draft"],["no","Said no"],["bounced","Bounced"]];
const NAME = Object.fromEntries([...STAGES, ...OUTCOMES]);
NAME.draft = "Draft sent";
const ORDER = STAGES.map(s => s[0]);
const KEY = "pp-control-key";
let D = null, filter = "all", query = "", callQuery = "", openRow = null, shown = 60;
let pitch = "all";
const PITCH_NAME = {w: "Website", h: "Hospitality"};
const H_NAME = {q: "Menu questionnaire", draft: "Sample menu + payment link sent", dfu1: "Sample menu follow-up 1",
  dfu2: "Sample menu follow-up 2", draft_replied: "Replied to sample menu", draft_noreply: "No response to sample menu"};
const inPitch = x => pitch === "all" || x.p === pitch;
const label = (k, p) => ((p || pitch) === "h" && H_NAME[k]) || NAME[k];
const ptag = x => pitch === "all" && x.p ? `<span class="ptag ${x.p}">${PITCH_NAME[x.p]}</span>` : "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},
               set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const money = n => "£" + Number(n || 0).toLocaleString("en-GB", {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2});
function nice(iso){
  if(!iso) return "";
  const d = new Date(iso + "T12:00:00"), t = new Date(D.today + "T12:00:00");
  const diff = Math.round((t - d) / 864e5);
  if(diff === 0) return "today"; if(diff === 1) return "yesterday";
  if(diff > 1 && diff < 7) return diff + " days ago";
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}
function addDays(iso, n){ const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
function stageColor(s){ const i = ORDER.indexOf(s); return i >= 0 ? `var(--s${i+1})` : "var(--muted)"; }
function pill(c){
  if(c.s === "replied" || c.s === "draft_replied") return `<span class="pill rep">${esc(label(c.s, c.p))}</span>`;
  if(ORDER.indexOf(c.s) < 0) return `<span class="pill out">${esc(label(c.s, c.p))}</span>`;
  return `<span class="pill" style="background:${stageColor(c.s)}">${esc(label(c.s, c.p))}</span>`;
}
function since(c){
  const key = c.s in c.d ? c.s : ({replied:"first", noreply:"fu2", no:"first", bounced:"first", draft_replied:"draft", draft_noreply:"dfu2"})[c.s];
  const all = Object.values(c.d).sort();
  return c.d[key] || all[all.length - 1] || "";
}
const reached = (c, st) => st === "paid" ? c.s === "paid" : (st === "draft" ? !!(c.d.draft || c.d.paid) :
  st === "q" ? !!(c.d.q || c.d.draft || c.d.paid || c.dr) : !!c.d.first);

/* ---------- unlock ---------- */
async function deriveKey(pw, p){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(p.salt), iterations:p.it}, base, 256);
  return new Uint8Array(bits);
}
async function decrypt(raw, p){
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, key, b64(p.ct));
  return JSON.parse(new TextDecoder().decode(out));
}
async function unlock(pw, remember){
  const p = JSON.parse($("payload").textContent);
  const raw = await deriveKey(pw, p);
  D = await decrypt(raw, p);
  if(remember) store.set(KEY, JSON.stringify({pw}));
  start();
}
$("lockform").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("pw").value; if(!pw) return;
  $("unlockbtn").disabled = true; $("unlockbtn").textContent = "Opening…"; $("lockerr").textContent = "";
  try { await unlock(pw, $("remember").checked); }
  catch(err){ $("lockerr").textContent = "That password didn't work. Try again."; }
  $("unlockbtn").disabled = false; $("unlockbtn").textContent = "Open";
});
$("lockbtn").onclick = () => { store.del(KEY); location.reload(); };
$("refresh").onclick = () => { location.href = location.pathname + "?t=" + Date.now(); };
(async () => {
  if(!window.crypto || !crypto.subtle){ $("lockerr").textContent = "Open this page in Safari or Chrome to unlock it."; return; }
  const saved = store.get(KEY);
  if(saved){ try { await unlock(JSON.parse(saved).pw, false); } catch(e){ store.del(KEY); } }
})();

/* ---------- app ---------- */
function start(){
  $("lock").hidden = true; $("app").hidden = false;
  $("testbar").hidden = !D.test;
  const g = new Date(D.generated);
  $("updated").textContent = "Updated " + g.toLocaleString("en-GB", {weekday:"short", hour:"2-digit", minute:"2-digit", day:"numeric", month:"short"});
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => show(t.dataset.v));
  pitch = ["all","w","h"].includes(store.get("pp-pitch")) ? store.get("pp-pitch") : "all";
  const seg = () => document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === pitch)));
  document.querySelectorAll("#seg button").forEach(b => b.onclick = () => {
    pitch = b.dataset.p; store.set("pp-pitch", pitch); filter = "all"; openRow = null; shown = 60; seg(); renderAll(); });
  seg();
  const want = (location.hash || "").slice(1);
  renderAll();
  show(["overview","list","calls","activity"].includes(want) ? want : "overview");
}
function show(v){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.v === v)));
  ["overview","list","calls","activity"].forEach(x => $("v-" + x).hidden = x !== v);
  history.replaceState(null, "", "#" + v);
  window.scrollTo(0, 0);
}
function renderAll(){ renderOverview(); renderList(); renderCalls(); renderActivity(); }

function todos(){
  const C = D.contacts.filter(inPitch), out = [];
  const recentPaid = C.filter(c => c.s === "paid" && c.d.paid && c.d.paid >= addDays(D.today, -7));
  recentPaid.filter(c => c.tpl !== "waiting" && c.br !== "waiting").forEach(c => out.push({cls:"b-paid", tag:"Paid", b:c.b, p:c.p, sub:`${money(c.amt)}${c.pkg ? " · " + c.pkg : ""} · ${c.tpl === "sent" ? "Menu Template sent" : c.br === "sent" ? "Brand book sent" : "get in touch to start"}`, e:c.e}));
  C.filter(c => c.br === "waiting").forEach(c => out.push({cls:"b-act", tag:"Brand", b:c.b, p:c.p, sub:"Brand book is in your inbox · reply DELIVER, CHANGE or SKIP", e:c.e}));
  C.filter(c => c.tpl === "waiting").forEach(c => out.push({cls:"b-act", tag:"Canva", b:c.b, p:c.p, sub:"Bought the Menu Template · it's in your inbox · put it in Canva and reply with the link", e:c.e}));
  D.unmatched.forEach(u => out.push({cls:"b-bad", tag:"Check", b:`Payment of ${money(u.amount)} we couldn't match`, sub:`${u.email || "no email"} · ${nice(u.date)} · look in Stripe`}));
  D.approvals.filter(inPitch).forEach(a => out.push({cls:"b-act", tag:"Approve", b:(a.b || a.e), p:a.p, sub:`${a.p === "h" ? "Sample menu" : "Draft"} v${a.v} is in your inbox · reply APPROVE, REDO or SKIP · sent ${nice(a.since)}`, e:(C.find(c => c.e === a.e) || {}).e}));
  C.filter(c => c.s === "replied" || c.s === "draft_replied").forEach(c => out.push({cls:"b-act", tag:"Reply", b:c.b, p:c.p, sub:c.r ? `“${c.r.slice(0,90)}${c.r.length > 90 ? "…" : ""}”` : "Replied - answer them from " + (c.fr || "your inbox"), e:c.e}));
  C.filter(c => c.s === "q" && !c.dr).forEach(c => out.push({cls:"b-act", tag:c.p === "h" ? "Menu" : "Draft", b:c.b, p:c.p, sub:c.p === "h" ? `Menu sent ${nice(c.d.q)} · sample due by ${nice(addDays(c.d.q || D.today, 3))}` : `Questionnaire in ${nice(c.d.q)} · draft due by ${nice(addDays(c.d.q || D.today, 3))}`, e:c.e}));
  D.errors.filter(inPitch).forEach(x => out.push({cls:"b-bad", tag:"Problem", b:x.b, p:x.p, sub:(x.p === "h" ? "Sample menu" : "Draft") + " couldn't be built · to remove this, email the subject CLEAR " + x.b}));
  if(pitch !== "w") D.waitlist.filter(w => w.st === "booked" && w.paid >= addDays(D.today, -7) && !recentPaid.some(c => c.e === w.e || c.to === w.e)).forEach(w => out.push({cls:"b-paid", tag:"Booked", b:w.b, p:"h", sub:"Paid for the Bar Menu Consultancy · get in touch to arrange a time"}));
  return out;
}

function renderOverview(){
  const C = D.contacts.filter(inPitch), T = todos();
  const dot = $("todo-dot"); dot.hidden = !T.length; dot.textContent = T.length;
  const counts = Object.fromEntries([...STAGES, ...OUTCOMES].map(([k]) => [k, C.filter(c => c.s === k).length]));
  const max = Math.max(1, ...ORDER.map(k => counts[k]));
  const paid = C.filter(c => c.s === "paid");
  const revenue = paid.reduce((t, c) => t + (+c.amt || 0), 0);
  const care = paid.filter(c => c.care).length, rcare = paid.filter(c => c.rc).length;
  const webPaid = D.contacts.filter(c => c.s === "paid" && c.p === "w").length;
  const emailed = C.filter(c => c.d.first).length;
  const rq = C.filter(c => reached(c, "q")).length, rd = C.filter(c => reached(c, "draft")).length;
  const pct = (a, b) => b ? Math.round(a * 100 / b) + "%" : "–";

  const todoHtml = T.length ? T.map((t, i) => `<button class="item" data-e="${esc(t.e || "")}"><span class="badge ${t.cls}">${esc(t.tag)}</span><span class="main"><b>${esc(t.b)}${ptag(t)}</b><span class="sub">${esc(t.sub)}</span></span></button>`).join("")
    : `<div class="calm">You're all caught up. Nothing needs you right now.</div>`;

  const pipe = STAGES.map(([k, label], i) => `
    <button class="prow" data-f="${k}"><span class="n" style="background:${stageColor(k)}">${i+1}</span>
      <span class="lab"><b>${esc(pitch === "h" && H_NAME[k] ? H_NAME[k] : label)}</b><span class="bar"><i style="width:${counts[k] / max * 100}%;background:${stageColor(k)}"></i></span></span>
      <span class="c num">${counts[k]}</span></button>`).join("");
  const outs = OUTCOMES.filter(([k]) => counts[k]).map(([k, l]) => `<button class="chip" data-f="${k}">${esc(pitch === "h" && H_NAME[k] ? H_NAME[k] : l)}<span class="k">${counts[k]}</span></button>`).join("");

  // emails per day chart (drawn to scale)
  const pd = D.per_day, W = 340, H = 120, top = 18, bot = 20, bw = W / pd.length;
  const pmax = Math.max(1, ...pd.map(x => x[1]));
  const bars = pd.map(([day, n], i) => {
    const h = n / pmax * (H - top - bot), x = i * bw + 3, y = H - bot - h;
    const lab = (i % 2 === (pd.length - 1) % 2) ? `<text x="${x + (bw - 6) / 2}" y="${H - 5}" text-anchor="middle">${new Date(day + "T12:00:00").getDate()}</text>` : "";
    const val = n ? `<text class="val" x="${x + (bw - 6) / 2}" y="${y - 4}" text-anchor="middle">${n}</text>` : "";
    return `<rect x="${x}" y="${y}" width="${bw - 6}" height="${Math.max(h, n ? 2 : 0)}" rx="3" fill="${day === D.today ? "var(--teal-2)" : "var(--s3)"}"/>${val}${lab}`;
  }).join("");
  const sentToday = D.limits.reduce((t, l) => t + l.sent, 0), capToday = D.limits.reduce((t, l) => t + l.max, 0);
  const lims = D.limits.map(l => `<div class="lim"><div class="t"><span>${esc(l.a)}</span><span class="num">${l.sent} of ${l.max}</span></div><div class="meter"><i style="width:${Math.min(100, l.sent / Math.max(1, l.max) * 100)}%"></i></div></div>`).join("");

  $("v-overview").innerHTML = `
   <div class="grid">
    <div class="card"><h2>Needs you <span class="count">${T.length || ""}</span></h2><div class="todo">${todoHtml}</div></div>
    <div class="card"><h2>Pipeline <span class="count">${C.length} businesses</span></h2>
      <p class="lead">Where every business is right now. Tap a stage to see who's in it.</p>
      <div class="pipe">${pipe}</div>
      ${outs ? `<div class="outs">${outs}</div>` : ""}
      <div class="conv"><div><b class="num">${pct(rq, emailed)}</b><span>emailed → questionnaire</span></div>
        <div><b class="num">${pct(rd, rq)}</b><span>questionnaire → ${pitch === "h" ? "sample" : "draft"}</span></div>
        <div><b class="num">${pct(paid.length, rd)}</b><span>${pitch === "h" ? "sample" : "draft"} → paid</span></div></div>
    </div>
   </div>
   <div class="grid">
    <div class="card"><h2>Money</h2><div class="money">
      <div class="stat"><div class="v num">${paid.length}</div><div class="k">Customers</div></div>
      <div class="stat"><div class="v num">${money(revenue)}</div><div class="k">Taken</div></div>
      <div class="stat"><div class="v num">${care}</div><div class="k">Care Plans</div></div>
      <div class="stat"><div class="v num">${rcare}</div><div class="k">Review Care</div></div>
      ${pitch !== "h" ? `<div class="stat"><div class="v num">${D.offer_on ? Math.max(0, D.launch - webPaid) : "Off"}</div><div class="k">Website launch places left</div>
        ${D.offer_on ? `<div class="meter"><i style="width:${Math.min(100, webPaid / D.launch * 100)}%"></i></div>` : ""}</div>` : ""}
    </div></div>
    <div class="card"><h2>Sending <span class="count num">${sentToday} of ${capToday} today</span></h2>
      <div class="limits">${lims || '<div class="calm">No sending addresses found.</div>'}</div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Emails sent per day, last 14 days">${bars}</svg>
      ${pitch !== "h" ? `<div class="prog"><b>Website:</b> ${esc(D.progress.website || "–")}<br><span>${D.queue.w} lined up to email next</span></div>` : ""}
      ${pitch !== "w" ? `<div class="prog"><b>Hospitality:</b> ${esc(D.progress.hospitality || "Not started yet")}<br><span>${D.queue.h} lined up to email next</span></div>` : ""}
      <div class="prog"><span>${D.calls.filter(inPitch).length} on your call list<br>
        ${pitch !== "h" ? `Website outreach last ran ${esc(D.runs.outreach || "–")} · drafts ${esc(D.runs.drafts || "–")}<br>` : ""}
        ${pitch !== "w" ? `Hospitality outreach last ran ${esc(D.runs.hosp || "–")} · menus ${esc(D.runs.menus || "–")}` : ""}</span></div>
    </div>
    ${pitch !== "w" ? waitlistCard() : ""}
   </div>`;
  $("v-overview").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; query = ""; shown = 60; renderList(); show("list"); });
  $("v-overview").querySelectorAll(".item").forEach(b => b.onclick = () => {
    if(!b.dataset.e) return; filter = "all"; query = ""; openRow = b.dataset.e; renderList(); show("list");
    const r = document.querySelector(`.row[data-e="${CSS.escape(b.dataset.e)}"]`); if(r) r.scrollIntoView({block:"center"});
  });
}

function waitlistCard(){
  const W = D.waitlist, wait = W.filter(w => w.st === "waiting"), inv = W.filter(w => w.st === "invited"), booked = W.filter(w => w.st === "booked");
  const rows = wait.slice(0, 12).map((w, i) => `<div class="r"><span class="n">${i + 1}.</span><b>${esc(w.b || w.e)}</b><span class="sub">joined ${esc(nice(w.j))}</span></div>`).join("")
    || `<div class="calm">Nobody waiting right now.</div>`;
  const offered = inv.slice(-5).reverse().map(w => `<div class="r"><span class="n">→</span><b>${esc(w.b || w.e)}</b><span class="sub">offered ${esc(nice(w.inv))}</span></div>`).join("");
  return `<div class="card"><h2>Consultancy waitlist <span class="count">${wait.length} waiting</span></h2>
    <p class="lead">${booked.length} booked · ${inv.length} offered a place, waiting to pay${D.open_slots ? ` · ${D.open_slots} place${D.open_slots > 1 ? "s" : ""} saved for the next person` : ""}</p>
    <div class="wl">${rows}</div>
    ${offered ? `<p class="lead" style="margin:12px 0 6px">Offered a place</p><div class="wl">${offered}</div>` : ""}
    <div class="hint">Ready for your next client? Email <code>${esc(D.home || "your Pour & Pixel inbox")}</code> with the subject <code>SLOT OPEN</code>. The next person in line is sent their payment link within 3 hours.</div></div>`;
}

function detail(c){
  const steps = STAGES.map(([k, l]) => {
    const on = !!c.d[k], due = !on && nextDue(c, k);
    return `<li class="${on ? "on" : "off"}"><i></i><span>${esc(c.p === "h" && H_NAME[k] ? H_NAME[k] : l)}</span><span class="dt">${on ? esc(nice(c.d[k])) : due ? "due " + esc(nice(due)) : ""}</span></li>`;
  }).join("");
  const rows = [["Pitch", PITCH_NAME[c.p] || ""], ["Email", c.to && c.to !== c.e ? `${esc(c.e)}<br>${esc(c.to)} (draft sent here)` : esc(c.e)],
    ["Phone", c.ph ? `<a href="tel:${esc(c.ph.replace(/\s/g, ""))}">${esc(c.ph)}</a>` : ""],
    ["Website", c.w ? `<a href="${esc(c.w)}" target="_blank" rel="noopener">${esc(c.w.replace(/^https?:\/\/(www\.)?/, "").split(/[?#]/)[0])}</a>` : ""],
    ["Contact", esc(c.nm)], ["Town", esc(c.t)], ["Emailed from", esc(c.fr)], ["Found by", esc(c.fb)],
    ["Paid", c.s === "paid" ? esc(money(c.amt) + (c.pkg ? " · " + c.pkg : "") + (c.care ? " · Care Plan" : "") + (c.rc ? " · Review Care" : "")) : ""],
    [c.p === "h" ? "Sample menu" : "Draft", {waiting:"Waiting for your APPROVE", skipped:"You skipped it", error:"Couldn't be built", building:"Being built"}[c.dr] || ""],
    ["Notes", esc(c.n)]].filter(r => r[1]);
  return `<div class="detail">
    ${c.r ? `<div class="quote">“${esc(c.r)}”</div>` : ""}
    <ul class="tl">${steps}</ul>
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <div class="acts">${c.ph ? `<a class="btn" href="tel:${esc(c.ph.replace(/\s/g, ""))}">Call</a>` : ""}
      ${c.e && !c.e.startsWith("no-email") ? `<a class="btn" href="mailto:${esc(c.to || c.e)}">Email</a>` : ""}
      ${c.pay ? `<button class="btn" data-copy="${esc(c.pay)}">Copy payment link</button>` : ""}</div>
  </div>`;
}
function nextDue(c, k){
  const i = ORDER.indexOf(k), cur = ORDER.indexOf(c.s);
  if(i !== cur + 1) return "";
  const last = c.d[c.s]; if(!last) return "";
  if(["fu1","fu2","dfu1","dfu2"].includes(k)) return addDays(last, D.gap);
  return "";
}

function renderList(){
  const C = D.contacts.filter(inPitch);
  const counts = {}; C.forEach(c => counts[c.s] = (counts[c.s] || 0) + 1);
  const chips = [["all","All", C.length], ...[...STAGES, ...OUTCOMES].filter(([k]) => counts[k]).map(([k, l]) => [k, label(k), counts[k]])];
  if(filter !== "all" && !counts[filter]) chips.push([filter, label(filter), 0]);
  const q = query.toLowerCase();
  const rows = C.filter(c => (filter === "all" || c.s === filter) &&
      (!q || [c.b, c.e, c.t, c.to, c.nm].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => (since(b) || "").localeCompare(since(a) || "") || a.b.localeCompare(b.b));
  $("v-list").innerHTML = `
    <input class="search" id="q" type="search" placeholder="Search businesses, emails or towns" value="${esc(query)}" aria-label="Search businesses">
    <div class="chips" style="margin-top:10px">${chips.map(([k, l, n]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${esc(l)}<span class="k">${n}</span></button>`).join("")}</div>
    <div class="list">${rows.slice(0, shown).map(c => `
      <button class="row" data-e="${esc(c.e)}" aria-expanded="${openRow === c.e}"><span class="main"><b>${esc(c.b || c.e)}${ptag(c)}</b>
        <span class="sub">${esc([c.t, nice(since(c))].filter(Boolean).join(" · "))}</span></span>${pill(c)}</button>
      ${openRow === c.e ? detail(c) : ""}`).join("") || `<div class="empty">No businesses here yet.</div>`}</div>
    ${rows.length > shown ? `<button class="btn more" id="more">Show more (${rows.length - shown} left)</button>` : ""}`;
  const qi = $("q");
  qi.oninput = () => { query = qi.value; shown = 60; const pos = qi.selectionStart; renderList(); const n = $("q"); n.focus(); n.setSelectionRange(pos, pos); };
  $("v-list").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; shown = 60; renderList(); });
  $("v-list").querySelectorAll(".row").forEach(b => b.onclick = () => { openRow = openRow === b.dataset.e ? null : b.dataset.e; renderList(); });
  $("v-list").querySelectorAll("[data-copy]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch(err){ b.textContent = "Couldn't copy"; }
  });
  if($("more")) $("more").onclick = () => { shown += 100; renderList(); };
}

function renderCalls(){
  const q = callQuery.toLowerCase();
  const weekAgo = addDays(D.today, -7);
  const calls = D.calls.filter(inPitch);
  const rows = calls.filter(r => !q || [r.b, r.t, r.ty, r.ph].join(" ").toLowerCase().includes(q));
  const fresh = calls.filter(r => r.f >= weekAgo).length;
  $("v-calls").innerHTML = `
    <div class="card" style="margin-bottom:12px"><h2>Call list <span class="count">${calls.length} businesses</span></h2>
      <p class="lead" style="margin:0">Businesses with no proper website, so they can't be emailed. These are often your best prospects. ${fresh} were added this week.</p></div>
    <input class="search" id="cq" type="search" placeholder="Search by name, town or type" value="${esc(callQuery)}" aria-label="Search call list">
    <div class="list">${rows.slice(0, 200).map(r => `
      <div class="row" style="cursor:default"><span class="main"><b>${esc(r.b)}${ptag(r)}</b>
        <span class="sub">${esc([r.ty, r.t, r.st].filter(Boolean).join(" · "))}${r.f >= weekAgo ? " · new" : ""}</span></span>
        ${r.ph ? `<a class="btn primary" href="tel:${esc(r.ph.replace(/\s/g, ""))}" aria-label="Call ${esc(r.b)}">Call</a>` : ""}
        ${r.m ? `<a class="btn" href="${esc(r.m)}" target="_blank" rel="noopener" aria-label="Map">Map</a>` : ""}</div>`).join("") || `<div class="empty">Nothing here yet.</div>`}</div>
    ${rows.length > 200 ? `<p class="lead" style="margin-top:10px">Showing 200 of ${rows.length}. Search to find others.</p>` : ""}`;
  const ci = $("cq");
  ci.oninput = () => { callQuery = ci.value; const pos = ci.selectionStart; renderCalls(); const n = $("cq"); n.focus(); n.setSelectionRange(pos, pos); };
}

function renderActivity(){
  const groups = {};
  const P = Object.fromEntries(D.contacts.map(c => [c.e, c.p]));
  D.events.filter(e => pitch === "all" || (P[e.email] || (/waitlist|consultancy/i.test(e.text) ? "h" : "w")) === pitch).forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
  const tone = t => /paid/i.test(t) ? "g" : /repl|questionnaire|approve/i.test(t) ? "w" : /no thanks|said no|bounced|didn't work/i.test(t) ? "r" : "";
  const days = Object.keys(groups).sort().reverse();
  $("v-activity").innerHTML = `<div class="card"><h2>Activity</h2><p class="lead">Everything the Autopilot has done, newest first.</p>
    ${days.map(day => `<div class="day"><h3>${esc(nice(day))}${nice(day).match(/^\d|ago/) ? "" : ""}</h3>
      ${groups[day].map(e => `<div class="ev"><i class="${tone(e.text)}"></i><div><b>${esc(e.business || e.email)}</b><br><span>${esc(e.text)}</span></div></div>`).join("")}</div>`).join("")
      || `<div class="empty">Activity will appear here after the next run.</div>`}</div>`;
}
</script>
</body>
</html>
